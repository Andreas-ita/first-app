<div class="register-container">
    <h2>Register</h2>
    <form (ngSubmit)="onRegister()">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" [(ngModel)]="registerModel.username" name="username" required>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" [(ngModel)]="registerModel.email" name="email" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" [(ngModel)]="registerModel.password" name="password" required>
        </div>
        <button type="submit">Register</button>
        <p *ngIf="message" [ngClass]="{'success': message.includes('successfully'), 'error': !message.includes('successfully')}">
            {{ message }}
        </p>
    </form>
</div>
