<div class="login-container">
    <h2>Login</h2>
    <form (ngSubmit)="onSubmit()">
        <div>
            <label>Username:</label>
            <input [(ngModel)]="loginModel.username" name="username" required>
        </div>
        <div>
            <label>Password:</label>
            <input [(ngModel)]="loginModel.password" type="password" name="password" required>
        </div>
        <button class="primary" type="submit">Login</button>
        <br />
        <div *ngIf="errorMessage" style="color: red;">
            {{ errorMessage }}
        </div>
    </form>
</div>
