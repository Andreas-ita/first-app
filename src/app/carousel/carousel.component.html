<div class="carousel-wrapper">
    <div class="carousel-container" #slidesContainer>
        <div class="carousel-slide" *ngFor="let slide of slides; let i = index">
            <div class="slide-background" [style.backgroundImage]="'url(' + slide.imageUrl + ')'"></div>

            <div class="slide-overlay"></div>

            <div class="slide-content">
                <h1 class="slide-title">{{ slide.title }}</h1>
                <p class="slide-subtitle">{{ slide.subtitle }}</p>
                <a [routerLink]="slide.buttonLink" class="cta-button">
                    {{ slide.buttonText }}
                </a>
            </div>
        </div>
    </div>

    <!-- Navigation arrows (visible on desktop) -->
    <button class="carousel-arrow left" (click)="prevSlide()">←</button>
    <button class="carousel-arrow right" (click)="nextSlide()">→</button>

    <!-- Dots indicators -->
    <div class="carousel-dots">
        <span *ngFor="let slide of slides; let i = index"
              [class.active]="i === currentIndex"
              (click)="goToSlide(i)"></span>
    </div>
</div>
